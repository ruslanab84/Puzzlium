name: Puzzlium

options:
  bundleIdPrefix: RuslanAbd
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 58ZSRJHNGW
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  PuzzliumKit:
    path: Packages/PuzzliumKit

targets:
  Puzzlium:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PuzzliumKit
        product: PuzzliumFeatures
      - package: PuzzliumKit
        product: PuzzliumData
      - package: PuzzliumKit
        product: PuzzliumDomain
      - package: PuzzliumKit
        product: PuzzliumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: RuslanAbd.Puzzlium
        PRODUCT_NAME: Puzzlium
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Puzzlium
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to turn it into a puzzle.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: true
      testTargets:
        - PuzzliumUITests

  PuzzliumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Puzzlium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: RuslanAbd.Puzzlium.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Puzzlium
        CODE_SIGN_STYLE: Automatic
